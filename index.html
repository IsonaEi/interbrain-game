body{background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:relative}
/* 版面系統（與畫布共用）：直角、3 px 深色框；可按的東西多一條 3 px 底部陰影；選中＝深底米字；間距以 11 為單位 */
canvas{display:block;box-sizing:content-box;max-width:calc(100vw - 12px);max-height:calc(100vh - 12px);object-fit:contain;image-rendering:pixelated;border:3px solid var(--ink);touch-action:none}
button{font:inherit;cursor:pointer}
.card button,#rotate button{font-size:22px;padding:5px 11px;border-radius:0;border:3px solid var(--ink);background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.card button:active,#rotate button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card button.on{background:var(--ink);color:var(--panel)}
button:focus-visible{outline:3px solid #ffe08a;outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(42,34,48,.62)}
.overlay[hidden]{display:none}
.card{touch-action:manipulation;background:var(--panel);border:3px solid var(--ink);padding:22px;width:min(660px,92%);max-height:92%;overflow:auto}
.card h2{margin:0;font-size:33px;font-weight:400;line-height:1.33}
.card>h2{margin:0 0 11px}
.card p{margin:0 0 11px;font-size:22px;line-height:1.5}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:11px;margin:0 0 11px}
.card .row{display:grid;grid-template-columns:5.5em 1fr;gap:11px;align-items:center;margin:0 0 11px}
.card .opts{display:flex;flex-wrap:wrap;gap:11px}
.card .opts button,.card .act button{min-width:4.5em;min-height:44px}
.card .lab{font-size:16px}
.card .act{display:flex;justify-content:flex-end;gap:11px;margin:11px 0 3px}
.keys{font-size:22px!important;color:rgba(63,38,49,.75)}
/* 分頁：像頁籤而不是選項——選中的有底線，不填色 */
.tabs{display:flex;gap:0}
.card .tabs button{box-shadow:none;border:0;border-bottom:3px solid transparent;background:none;color:rgba(63,38,49,.6);padding:3px 11px}
.card .tabs button.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.card .tabs button:active{transform:none}
@media (max-height:520px){.card h2{font-size:22px}.card p,.keys{font-size:16px!important}.card button,#rotate button{font-size:16px;padding:3px 8px}
  .card{padding:11px 22px;max-height:98%}.card p{margin:0 0 6px;line-height:1.4}.card .head,.card>h2{margin:0 0 6px}.card .row{margin:0 0 6px;gap:6px}.card .opts{gap:6px}.card .act{margin:6px 0 3px}.card .opts button,.card .act button{min-height:36px}}
/* 操作說明只顯示這台裝置用的那行 */
.dev-touch{display:none} @media (pointer:coarse){.dev-touch{display:block}.dev-desk{display:none}}
.page[hidden],.card [hidden]{display:none!important}
b.h{color:var(--human)} b.a{color:var(--ai)}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;gap:22px;align-items:center;justify-content:center;background:var(--bg);color:var(--panel);
  font-size:22px;line-height:1.5;text-align:center;padding:22px;z-index:9}
#rotate div{max-width:100%;overflow-wrap:anywhere}
#rotate .ic{font-size:44px;line-height:1}
#rotate button{border-color:var(--panel);box-shadow:0 3px 0 var(--panel);background:var(--bg);color:var(--panel)}
#rotate button.on{background:var(--panel);color:var(--ink);border-color:var(--panel)}
@media (orientation:portrait) and (pointer:coarse) and (max-width:600px){body:not(.portrait-ok) #rotate{display:flex}}
</style>

<div id="rotate"><div class="ic">↻</div><div>請把手機轉成橫向來玩<br>轉了沒反應的話，<br>請關閉「直向鎖定」</div><button id="rotateFs" class="on" hidden>全螢幕並自動轉橫向</button><button id="portraitOk">仍要直向玩</button></div>
<div id="wrap">
  <canvas id="cv" width="1312" height="640"></canvas>
  <div class="overlay" id="startOv">
    <div class="card">
      <h2>雙人圍獵</h2>
      <p>你是<b class="h">戴帽的獵人</b>，AI 隊友是<b class="a">盔甲騎士</b>。</p>
      <p>靠近鹿，鹿就會逃開。一個人趕不進柵欄，要兩個人從兩側夾住牠，才趕得進去。越快抓到分數越高。</p>
      <p class="keys dev-desk">電腦：方向鍵或 WASD 移動、M 選單、空白鍵暫停</p>
      <p class="keys dev-touch">手機：按住畫面任一處拖動來移動</p>
      <div class="act"><button id="startBtn" class="on" autofocus>開始</button></div>
    </div>
  </div>
  <div class="overlay" id="menuOv" hidden>
    <div class="card">
      <div class="head"><h2>選單</h2><div class="tabs"><button data-tab="play">玩法</button><button data-tab="set">設定</button></div></div>
      <div class="page" data-page="play">
      <div class="row"><span class="lab">子規則</span><div class="opts">
        <button data-mode="r1">R1 基礎圍獵</button><button data-mode="r2">R2 兔與鹿</button><button data-mode="r3">R3 兩個柵欄</button></div></div>
      <div class="row"><span class="lab">視野</span><div class="opts">
        <button data-vis="see">看得到隊友</button><button data-vis="blind">看不到隊友</button></div></div>
      <p class="keys">切換會重新計分；「說明」鈕顯示 AI 在做什麼。</p>
      </div>
      <div class="page" data-page="set" hidden>
      <div class="row"><span class="lab">驅趕圈</span><div class="opts">
        <button data-ring="on">顯示</button><button data-ring="off">隱藏</button></div></div>
      <div class="row" id="fsRow"><span class="lab">全螢幕</span><div class="opts">
        <button data-fs="on">開</button><button data-fs="off">關</button></div></div>
      <p class="keys" id="fsHint" hidden>這支手機不支援網頁全螢幕：在瀏覽器選單按「加到主畫面」，從主畫面開啟就沒有網址列。</p>
      <p class="keys">美術素材：Kenney Tiny 系列（CC0）；字型：Cubic 11</p>
      </div>
      <div class="act"><button id="restartBtn">重來（分數歸零）</button><button id="closeBtn" class="on">繼續</button></div>
    </div>
  </div>
</div>

<script>
// SIM-BEGIN
// 模擬邏輯：不碰 DOM／canvas；test_sim.js 以 vm 抽出這段執行。機制與數字來自 proto-herd/core.js、run.js。
const SIM = (() => {
  const CONFIG = {
    W: 960, H: 640, dt: 1 / 60, T: 40,
    trapInset: 110, trapR: 50,          // 柵欄中心離兩面牆各 trapInset；每回合隨機一個角落
    vH: 200, vBotMul: 1.3,            // 鹿最高速＝獵人 1.3 倍；靠太近就追不上
    R: 120, thetaMin: 50, beta: 40,    // 側閃：遠離方向轉 40°；遠離分速 cos40°×鹿速 ≥ 獵人速，才保持得住距離
    sideAhead: 90, sideWall: 30, sidePen: 2,
    trapAvoidD: 70, wallD: 60, kw: 1.5, wanderMul: 0.3, speedGain: 2.16,   // 逃跑速度在 0.75R 處等於獵人速度
    fleeFloor: 0.5,    // 一進驅趕圈就至少用這個比例的速度逃，圈的大小與逃跑時機對得上
    sideHold: 0.6,     // 側閃選邊後至少維持的秒數（防抖）
    botResp: 16,       // 鹿速度的反應率（1/s）；越小轉向越平滑
    pinchMul: 0.8,     // 被夾住時鹿的速度上限（×獵人速度），兩人才跟得上、推得動
    botMargin: 40,     // 鹿離牆最小距離，避免貼死在角落、獵人繞不到背後
    grace: 1.0, hold: 1.0, thetaSep: 80, fillMax: 80, standR: 0.85, thetaF: 40,
    orbitIn: 1.25, orbitCos: 0.6, orbitR: 1.3, orbitRot: 0.7,
    blindSw: 1.5, startBotTrap: 3, startHunterBot: 1.5, startMargin: 60,
    hunterMargin: 16,
    aiOn: true,
    r3: null,          // R3 開啟時為參數物件（見 R3DEF）；null＝單一 Trap（基底／R1）
    r2: null,          // R2 開啟時為參數物件（見 R2DEF）；null＝沒有兔子
  };
  const R3DEF = {
    layout: 'nshort',  // 兩 Trap 的角落組合：nshort（對角或同一長邊，排除同一短邊）／any（任兩角）／diag（對角）／long（同一長邊）／short（同一短邊）／adj（相鄰）
    hiMul: 3, loMul: 1, info: null,   // info：'H' 人知／'A' AI 知／'N' 都不知；null＝每回合隨機各 1/3
    seeR: 1.2, acq: 45, keep: 95, margin: 20, apprV: 0.3,  // 讀人：人在鹿 seeR·R 內；背側角度 < acq° 新判、< keep° 沿用；兩個都在時差 > margin°；靠近＝距離縮短速度 > apprV·vH
    Edecay: 1.5, Emax: 2, decT: 1.5, folT: 0.6, otherLow: 0.3,   // 證據累積（s）：果斷＝E ≥ decT 且另一個 < otherLow；跟上＝E ≥ folT
    hesT: 2.0,         // 人猶豫（沒靠近鹿、也沒推任何 Trap）累計 hesT 秒 → 試探
    rs: 1.5, wideA: 60, arcStep: 0.5, alignA: 8, dashR: 0.55, dashT: 1.8, arcMax: 3.0, watchT: 1.5, sigMax: 2, insistT: 2.5,   // 示意；讓步＝示意完成後人連續推另一個 insistT 秒
    probeT: 1.2, probeMax: 2, probeStopR: 1.5,   // 試探
    waitR: 1.8,        // 等待站位半徑（×R）；離鹿 < 1.2R 時先沿徑向退開
    swHold: 1.0,       // 行為切換後至少維持（s）
  };
  const R2DEF = {
    rabR: 28, dwellT: 1.0, rabMul: 0.5,   // 抓兔＝獵人中心在兔 rabR 內連續停 dwellT 秒；得 ceil(剩餘秒數 × rabMul)，只給抓到的人
    // 兔子位置（×R，牆為 px）：離 Trap、鹿起點、兩個獵人起點、另一隻兔子的最小距離
    rabTrap: 2.5, rabBot: 2.5, rabHunt: 2.5, rabRab: 3.0, rabWall: 60, rabTop: 145, rabBottom: 100,   // 上下避開 HUD、提示與說明列
    // 讀人：人朝兔 j 走＝移動速度 > headV·vH、朝兔 j 的靠近速度 > cos(headA°)×速度、朝鹿的靠近速度 < apprB·vH（繞去鹿背後的人會一直靠近鹿），或人在兔 nearR·R 內；人在鹿 farB·R 內不算
    headV: 0.5, headA: 40, apprB: 0.3, nearR: 0, farB: 1.6,
    Edecay: 1.5, Emax: 2, trigE: 0.4, decE: 1.0, commitR: 2.5, onT: 0.35,   // commitR：判定「人仍去抓兔」還要人離那隻兔 < commitR·R（亂逛的人不會被當成去抓兔）   // 證據（s）：≥ trigE 觸發示意；示意完成後 ≥ decE＝人仍去抓兔
    rs: 1.5, wideA: 0, arcStep: 0.5, alignA: 8, dashR: 0.55, dashT: 0.8, arcMax: 3.0, watchT: 0.3, sigMax: 1, abortOn: true,   // 示意（同 R3 繞弧＋衝刺，但不先外擺、衝刺 0.8 s、判斷窗 0.3 s：人走到兔再停 1 s 中位約 2.9 s），每回合一次；abortOn：人已站上兔計時且不在衝刺中 → 直接搶另一隻
    lateT: 4,          // 剩餘 ≤ lateT 秒而鹿 lateGrace 秒內沒被夾住 → AI 改抓兔（含停 1 s；AI 平均分在 lateT 4–10 s 持平、12 s 下降；取持平段最小值，人損失最少）
    lateGrace: 1.0,
    avoid: 16,         // AI 不抓兔時與兔子保持 rabR + avoid 的距離（繞開）
    swHold: 1.0,       // 行為切換後至少維持（s）
  };
  const D2R = Math.PI / 180;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
  const len = a => Math.hypot(a[0], a[1]), unit = a => { const l = len(a) || 1e-9; return [a[0] / l, a[1] / l]; };
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const rot = (a, t) => [a[0] * Math.cos(t) - a[1] * Math.sin(t), a[0] * Math.sin(t) + a[1] * Math.cos(t)];
  const ang = (a, b) => Math.atan2(a[0] * b[1] - a[1] * b[0], dot(a, b));
  const clampLen = (v, m) => { const l = len(v); return l > m ? mul(v, m / l) : v; };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function newRound(opts) {
    const C = Object.assign({}, CONFIG, opts.config || {});
    const rnd = mulberry32(opts.seed >>> 0);
    const I = C.trapInset, corners = [[I, I], [C.W - I, I], [I, C.H - I], [C.W - I, C.H - I]];
    if (C.r3) {
      C.r3 = Object.assign({}, R3DEF, C.r3);
      const pairs = { any: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]], diag: [[0, 3], [1, 2]], long: [[0, 1], [2, 3]], short: [[0, 2], [1, 3]], adj: [[0, 1], [2, 3], [0, 2], [1, 3]], nshort: [[0, 3], [1, 2], [0, 1], [2, 3]] }[C.r3.layout];
      const pr = pairs[Math.floor(rnd() * pairs.length)], hi = rnd() < .5 ? 0 : 1;
      C.traps = pr.map((ci, i) => ({ p: corners[ci], mul: i === hi ? C.r3.hiMul : C.r3.loMul, hi: i === hi }));
      C.hi = hi;
      C.info = C.r3.info || ['H', 'A', 'N'][Math.floor(rnd() * 3)];
      C.trap = C.traps[C.r3.ref === 'lo' ? 1 - hi : hi].p;   // 單人腳本推的目標（預設高分）
    } else {
      C.trap = opts.trap || (opts.config && opts.config.trap) || corners[Math.floor(rnd() * 4)];
      C.traps = [{ p: C.trap, mul: 1, hi: true }]; C.hi = 0;
    }
    const inside = (p, m = 0) => [Math.min(C.W - m, Math.max(m, p[0])), Math.min(C.H - m, Math.max(m, p[1]))];
    let bot, hum, ai;
    const M = C.startMargin;
    do { bot = [M + rnd() * (C.W - 2 * M), M + rnd() * (C.H - 2 * M)]; } while (C.traps.some(tr => len(sub(bot, tr.p)) < C.startBotTrap * C.R));
    do { hum = [M + rnd() * (C.W - 2 * M), M + rnd() * (C.H - 2 * M)]; } while (len(sub(hum, bot)) < C.startHunterBot * C.R);
    do { ai = [M + rnd() * (C.W - 2 * M), M + rnd() * (C.H - 2 * M)]; } while (len(sub(ai, bot)) < C.startHunterBot * C.R);
    let rabbits = null;
    if (C.r2) { C.r2 = Object.assign({}, R2DEF, C.r2); rabbits = r2Place(C, rnd, bot, hum, ai); }
    return {
      C, rnd, inside, t: 0, phase: 'play', result: null,
      blind: !!opts.blind,
      // 看不到隊友時 AI 推往的柵欄：R3 AI 知情＝高分那個，否則開局離鹿近的那個（之後不讀人、不改）
      aiTrapI: C.r3 && opts.blind ? (C.info === 'A' ? C.hi : (len(sub(C.traps[0].p, bot)) <= len(sub(C.traps[1].p, bot)) ? 0 : 1)) : C.hi,
      bot, botPrev: bot.slice(), hum, ai, rabbits, humPrev: hum.slice(), aiPrev: ai.slice(),
      botSt: { wt: 0, wd: 0, side: 0, sideT: 0, v: [0, 0], pinched: false, threat: false },
      aiSt: { mode: C.r3 ? (C.info === 'A' ? 'sig' : 'wait') : opts.blind ? 'blind' : 'lead', r3: C.r3 ? r3Init(C) : null, r2: C.r2 ? r2Init(C) : null, hold: 0, side: rnd() < .5 ? 1 : -1, lastIn: -9, pushing: false, target: ai.slice(), sw: 0, bside: 0 },
    };
  }

  const stand = (C, bot, u, phi, r) => add(bot, mul(rot(mul(u, -1), phi), (r || C.standR) * C.R));

  // AI 走向目標點；直線會從錯誤方向推到鹿時，沿外圈繞過去
  function goTo(S, p, tgt) {
    const C = S.C, bot = S.bot;
    const rel = sub(p, bot), rt = sub(tgt, bot);
    if (len(rel) < C.orbitIn * C.R && dot(unit(rel), unit(rt)) < C.orbitCos) {
      const sd = Math.sign(ang(rel, rt)) || 1;
      tgt = add(bot, mul(rot(unit(rel), sd * C.orbitRot), C.orbitR * C.R));
    }
    return S.inside(add(p, clampLen(sub(tgt, p), C.vH * C.dt)), C.hunterMargin);
  }

  function aiStep(S) {
    const C = S.C, A = S.aiSt, bot = S.bot, hum = S.hum;
    const u = unit(sub(S.blind ? C.traps[S.aiTrapI].p : C.trap, bot));
    let at;
    if (S.blind && C.r2) {
      // R2 看不到：只保留「時間不夠改抓兔」（不需要看人）；抓兔時直線走過去
      const Z = A.r2, P = C.r2;
      if (S.botSt.pinched) Z.pinT = S.t;
      if (A.mode !== 'rab' && C.T - S.t <= P.lateT && S.t - Z.pinT > P.lateGrace) {
        A.mode = 'rab'; Z.why = 'late'; Z.rab = len(sub(S.rabbits[0], S.ai)) <= len(sub(S.rabbits[1], S.ai)) ? 0 : 1;
      }
      if (A.mode === 'rab') {
        at = A.target = S.rabbits[Z.rab];
        S.ai = S.inside(add(S.ai, clampLen(sub(at, S.ai), C.vH * C.dt)), C.hunterMargin);
        return;
      }
    }
    if (S.blind) {
      // 看不到：不讀人，隨機換站位
      A.sw -= C.dt;
      if (A.sw <= 0) { A.bside = Math.floor(S.rnd() * 3) - 1; A.sw = C.blindSw * (0.7 + 0.6 * S.rnd()); }
      A.mode = 'blind'; A.pushing = false;
      at = stand(C, bot, u, A.bside * C.thetaF * D2R);
    } else {
      if (len(sub(hum, bot)) < C.R) A.lastIn = S.t;
      A.pushing = (S.t - A.lastIn) <= C.grace;
      const want = A.pushing ? 'fill' : 'lead';
      A.hold -= C.dt;
      if (want !== A.mode && A.hold <= 0) { A.mode = want; A.hold = C.hold; }
      if (A.mode === 'blind') A.mode = want;
      const phH = ang(mul(u, -1), unit(sub(hum, bot)));
      if (A.mode === 'fill') {
        let s = -Math.sign(phH); if (Math.abs(phH) < 5 * D2R) s = A.side; A.side = s;
        const m = Math.min(C.fillMax * D2R, Math.max(Math.abs(phH), C.thetaSep * D2R - Math.abs(phH)));
        at = stand(C, bot, u, s * m);
      } else {
        if (Math.abs(phH) > 5 * D2R) A.side = -Math.sign(phH);
        at = stand(C, bot, u, A.side * C.thetaF * D2R);
      }
    }
    A.target = at;
    const nx = goTo(S, S.ai, at);
    S.ai = C.r2 ? r2Avoid(S, S.ai, nx) : nx;   // R2 推鹿途中繞開兔子
  }

  // ---------- R3 AI：兩個 Trap ----------
  const R3LABEL = { sig: '示意', wait: '等待', probe: '試探', fill: '補位', lead: '帶路', yield: '讓步' };
  function r3Init(C) {
    const know = C.info === 'A';
    return { know, K: know ? C.hi : -1, ph: know ? 'start' : '', mt: 0, pt: 0, hold: 0, E: [0, 0], hT: -1, hes: 0, dhPrev: null, nSig: know ? 1 : 0, sigDone: 0, ins: 0, nProbe: 0,
      wside: 0, inR: false, rec: { sw: 0, modes: [], sigDisp: [], waitIn: 0, waitN: 0, yielded: false, idleBoth: 0, maxIdleBoth: 0 }, sig0: null };
  }
  const clamp1 = x => Math.max(-1, Math.min(1, x));
  // 感知：人位於哪個 Trap 的背側（鹿為中心，與「鹿→Trap」反方向夾角 < cone）；兩個都是時角度差 > margin 才換判，否則沿用
  function r3Perceive(S) {
    const C = S.C, P = C.r3, A = S.aiSt, Z = A.r3, bot = S.bot, hum = S.hum;
    const dh = len(sub(hum, bot));
    if (dh < C.R) A.lastIn = S.t;
    A.pushing = (S.t - A.lastIn) <= C.grace;
    const bh = unit(sub(hum, bot));
    const an = C.traps.map(tr => Math.acos(clamp1(-dot(bh, unit(sub(tr.p, bot))))));
    // 背側判定帶遲滯：新判一個 Trap 要在 acq° 內（兩個都在時要差 margin°），已判的只要還在 keep° 內就沿用（夾擊時人站斜後方 ≤ 80°）
    let k = -1;
    if (dh < P.seeR * C.R) {
      const j = Z.hT, bI = an[0] <= an[1] ? 0 : 1;
      if (j >= 0 && an[j] < P.keep * D2R && !(an[1 - j] < P.acq * D2R && an[1 - j] + P.margin * D2R < an[j])) k = j;
      else if (an[bI] < P.acq * D2R && an[1 - bI] - an[bI] > P.margin * D2R) k = bI;
    }
    // 猶豫累計：人沒在靠近鹿、也沒被判成在推某個 Trap 的時間
    const appr = Z.dhPrev != null && (Z.dhPrev - dh) / C.dt > P.apprV * C.vH;
    Z.dhPrev = dh;
    // 猶豫＝沒推任何 Trap、沒靠近鹿、而且人幾乎站著不動（繞到鹿背後的移動不算猶豫）
    const hv = len(sub(S.hum, S.humPrev)) / C.dt;
    if (k < 0 && !appr && hv < P.apprV * C.vH) Z.hes += C.dt;
    Z.hT = k;
    for (let i = 0; i < 2; i++) Z.E[i] = k === i ? Math.min(P.Emax, Z.E[i] + C.dt) : Math.max(0, Z.E[i] - P.Edecay * C.dt);
  }
  const r3Dec = (Z, P, k) => Z.E[k] >= P.decT && Z.E[1 - k] < P.otherLow;   // 人果斷推 k
  const r3Fol = (Z, P, k) => Z.E[k] >= P.folT;                               // 人跟上 k

  function r3Set(S, mode, K) {
    const A = S.aiSt, Z = A.r3;
    if (mode !== A.mode) { Z.rec.sw++; Z.rec.modes.push([+S.t.toFixed(2), mode, K]); Z.hold = S.C.r3.swHold; }
    A.mode = mode; Z.K = K; Z.mt = 0; Z.pt = 0; Z.inR = false;
    Z.ph = mode === 'sig' ? 'start' : mode === 'probe' ? 'push' : '';
  }

  // 投入中（補位／帶路／讓步）的站位：人在推 → 補位幾何；人沒在推 → 帶路幾何（同基底），軸都對 Trap K
  function r3Engaged(S, K) {
    const C = S.C, A = S.aiSt, bot = S.bot, hum = S.hum;
    const u = unit(sub(C.traps[K].p, bot));
    const phH = ang(mul(u, -1), unit(sub(hum, bot)));
    if (A.pushing) {
      let s = -Math.sign(phH); if (Math.abs(phH) < 5 * D2R) s = A.side; A.side = s;
      const m = Math.min(C.fillMax * D2R, Math.max(Math.abs(phH), C.thetaSep * D2R - Math.abs(phH)));
      return stand(C, bot, u, s * m);
    }
    if (Math.abs(phH) > 5 * D2R) A.side = -Math.sign(phH);
    return stand(C, bot, u, A.side * C.thetaF * D2R);
  }

  // 示意：從鹿背側繞大弧、對成一直線再衝刺推（R3、R2 共用）；Z＝S.aiSt.r2 或 .r3，P＝對應參數，engaged(k)＝判斷窗的站位
  function sigStep(S, P, k, engaged) {
    const C = S.C, Z = S.aiSt.r2 || S.aiSt.r3, bot = S.bot;
    const rel = sub(S.ai, bot), dA = len(rel);
    const u = unit(sub(C.traps[k].p, bot)), b = mul(u, -1), psi = ang(b, rel);
    let at, direct = false;
    Z.pt += C.dt;
    if (Z.ph === 'start') { Z.ph = Math.abs(psi) < P.wideA * D2R ? 'wide' : 'arc'; Z.wsgn = Math.sign(psi) || 1; Z.pt = 0; Z.sT = 0; }
    // 繞弧超時（例如鹿背後是牆、弧點在場外）：這次示意算完成，直接投入推，避免卡在牆邊
    if (Z.ph === 'wide' || Z.ph === 'arc') { Z.sT += C.dt; if (Z.sT > P.arcMax) { Z.ph = 'watch'; Z.pt = 0; Z.sigDone++; } }
    if (Z.ph === 'wide') {
      at = add(bot, mul(rot(b, Z.wsgn * P.wideA * D2R), P.rs * C.R));
      if (len(sub(at, S.ai)) < 25) { Z.ph = 'arc'; Z.pt = 0; }
    }
    if (Z.ph === 'arc') {
      const s = Math.sign(psi) || 1, np = psi - s * Math.min(Math.abs(psi), P.arcStep);
      at = add(bot, mul(rot(b, np), P.rs * C.R));
      if (Math.abs(psi) < P.alignA * D2R && Math.abs(dA - P.rs * C.R) < 30) { Z.ph = 'dash'; Z.pt = 0; Z.sig0 = { bot: bot.slice(), u }; }
    }
    if (Z.ph === 'dash') {
      // 衝刺：沿 u 直線推，不經過繞行規則
      at = add(bot, mul(b, P.dashR * C.R)); direct = true;
      if (Z.pt >= P.dashT) { Z.ph = 'watch'; Z.pt = 0; Z.sigDone++; }
    }
    if (Z.ph === 'watch') {
      at = engaged(k);
      if (Z.pt >= P.watchT - C.dt && Z.sig0) { Z.rec.sigDisp.push(dot(sub(bot, Z.sig0.bot), Z.sig0.u)); Z.sig0 = null; }
    }
    return [at, direct];
  }

  function aiStepR3(S) {
    const C = S.C, P = C.r3, A = S.aiSt, Z = A.r3, bot = S.bot, hum = S.hum;
    r3Perceive(S);
    Z.mt += C.dt; Z.hold -= C.dt;
    const K = Z.K, o = 1 - K, can = Z.hold <= 0;
    // ---- 行為切換 ----
    if (Z.know) {
      const H = C.hi;
      // 堅持＝示意完成後，人「連續」推另一個 Trap 的秒數；中斷或已讓步就歸零
      if (Z.hT === 1 - H && Z.sigDone >= 1 && A.mode !== 'yield') Z.ins += C.dt; else Z.ins = 0;
      const insist = Z.ins >= P.insistT && r3Dec(Z, P, 1 - H);
      if (A.mode === 'sig' && can) {
        if (r3Fol(Z, P, H)) r3Set(S, 'lead', H);
        else if (insist) { r3Set(S, 'yield', 1 - H); Z.rec.yielded = true; }
        else if (Z.ph === 'watch' && Z.pt >= P.watchT) {
          if (Z.nSig >= P.sigMax) r3Set(S, 'lead', H);
          else { Z.ph = 'start'; Z.pt = 0; Z.nSig++; }
        }
      } else if (A.mode === 'lead' && can) {
        if (Z.nSig < P.sigMax && r3Dec(Z, P, 1 - H)) { r3Set(S, 'sig', H); Z.nSig++; }
        else if (insist) { r3Set(S, 'yield', 1 - H); Z.rec.yielded = true; }
      } else if (A.mode === 'yield' && can) {
        if (r3Dec(Z, P, H)) r3Set(S, 'lead', H);
      }
    } else {
      if (A.mode === 'wait' && can) {
        if (r3Dec(Z, P, 0)) r3Set(S, 'fill', 0);
        else if (r3Dec(Z, P, 1)) r3Set(S, 'fill', 1);
        else if (Z.hes >= P.hesT) {
          const dT = C.traps.map(tr => len(sub(tr.p, bot)));
          const pk = Z.E[0] !== Z.E[1] ? (Z.E[0] > Z.E[1] ? 0 : 1) : (dT[0] < dT[1] ? 0 : 1);
          r3Set(S, 'probe', pk);
        }
      } else if (A.mode === 'probe' && can) {
        if (r3Fol(Z, P, K)) r3Set(S, 'lead', K);
        else if (r3Dec(Z, P, o)) { r3Set(S, 'yield', o); Z.rec.yielded = true; }
        else if (Z.ph === 'stop' && Z.pt >= P.watchT) {
          Z.nProbe++;
          if (Z.nProbe >= P.probeMax) r3Set(S, 'lead', K); else { Z.ph = 'push'; Z.pt = 0; Z.inR = false; }
        }
      } else if ((A.mode === 'fill' || A.mode === 'lead' || A.mode === 'yield') && can) {
        if (r3Dec(Z, P, o)) { if (A.mode === 'lead') { r3Set(S, 'yield', o); Z.rec.yielded = true; } else { Z.K = o; Z.hold = P.swHold; Z.rec.sw++; } }
      }
    }
    // ---- 目標點 ----
    const k = Z.K;
    let at, direct = false;
    const rel = sub(S.ai, bot), dA = len(rel);
    if (A.mode === 'wait') {
      // 站在人—鹿連線的垂直方向 waitR·R，選離 AI 目前方位近的一側；貼牆被夾回時換邊或往其他角度找，確保在 R 外
      const hb = len(sub(hum, bot)) > 1 ? unit(sub(hum, bot)) : [1, 0];
      if (!Z.wside) Z.wside = ang(hb, rel) >= 0 ? 1 : -1;
      const cands = [90, 120, 60, 150, 30, 180].flatMap(a => [Z.wside * a, -Z.wside * a]);
      at = null;
      for (const a of cands) { const p = S.inside(add(bot, mul(rot(hb, a * D2R), P.waitR * C.R)), C.hunterMargin); if (len(sub(p, bot)) >= 1.25 * C.R) { at = p; break; } }
      if (!at) at = S.inside(add(bot, mul(dA > 1 ? unit(rel) : [1, 0], P.waitR * C.R)), C.hunterMargin);
      // 已經離鹿不到 1.2R：先沿徑向退開
      if (dA < 1.2 * C.R) { at = S.inside(add(bot, mul(dA > 1 ? unit(rel) : [1, 0], P.waitR * C.R)), C.hunterMargin); direct = true; }
      Z.rec.waitN++; if (dA < C.R) Z.rec.waitIn++;
    } else if (A.mode === 'sig') {
      [at, direct] = sigStep(S, P, k, K_ => r3Engaged(S, K_));
    } else if (A.mode === 'probe') {
      const u = unit(sub(C.traps[k].p, bot));
      Z.pt += C.dt;
      if (Z.ph === 'push') {
        at = stand(C, bot, u, 0);
        if (dA < C.R) Z.inR = true;
        if (Z.inR) Z.mt2 = (Z.mt2 || 0) + C.dt; else Z.mt2 = 0;
        if (Z.mt2 >= P.probeT || Z.pt > P.probeT + 3) { Z.ph = 'stop'; Z.pt = 0; Z.mt2 = 0; }
      }
      if (Z.ph === 'stop') at = add(bot, mul(u, -P.probeStopR * C.R));
    } else at = r3Engaged(S, k);
    // 雙方都不推的連續時間（卡死偵測）
    const aiPush = dA < C.R;
    if (A.mode === 'wait' && len(sub(hum, bot)) >= C.R) { Z.rec.wI = (Z.rec.wI || 0) + C.dt; Z.rec.wIMax = Math.max(Z.rec.wIMax || 0, Z.rec.wI); } else Z.rec.wI = 0;
    if (!aiPush && len(sub(hum, bot)) >= C.R) { Z.rec.idleBoth += C.dt; Z.rec.maxIdleBoth = Math.max(Z.rec.maxIdleBoth, Z.rec.idleBoth); } else Z.rec.idleBoth = 0;
    A.target = at;
    S.ai = direct ? S.inside(add(S.ai, clampLen(sub(at, S.ai), C.vH * C.dt)), C.hunterMargin) : goTo(S, S.ai, at);
  }

  // ---------- R2：兔與鹿 ----------
  // 兔子位置：每隻離 Trap、鹿起點、兩個獵人起點、另一隻兔子都夠遠；抽不到就把距離放寬 10% 再抽
  function r2Place(C, rnd, bot, hum, ai) {
    const P = C.r2, R = C.R, m = P.rabWall;
    for (let f = 1; ; f *= 0.9) {
      const out = [];
      for (let n = 0; n < 400 && out.length < 2; n++) {
        const p = [m + rnd() * (C.W - 2 * m), P.rabTop + rnd() * (C.H - P.rabTop - P.rabBottom)];
        if (len(sub(p, C.trap)) >= P.rabTrap * R * f && len(sub(p, bot)) >= P.rabBot * R * f && len(sub(p, hum)) >= P.rabHunt * R * f && len(sub(p, ai)) >= P.rabHunt * R * f
          && out.every(q => len(sub(p, q)) >= P.rabRab * R * f)) out.push(p);
      }
      if (out.length === 2) { out.forEach(p => { p.hold = { hum: 0, ai: 0 }; }); return out; }
    }
  }
  const R2LABEL = { lead: '帶路', fill: '補位', sig: '示意', rab: '抓兔' };
  function r2Init(C) {
    return { ph: '', pt: 0, hold: 0, E: [0, 0], hR: -1, nSig: 0, sigDone: 0, rab: -1, why: '', pinT: -9, sig0: null,
      rec: { sw: 0, modes: [], sigDisp: [], sigT: -1, dashT: -1, sigEnd: -1, rabT: -1, rabWhy: '', minRabD: 1e9, idleBoth: 0, maxIdleBoth: 0 } };
  }
  // 說明列一行：AI 行為｜對人的判斷｜打算抓什麼
  function r2Say(S) {
    const A = S.aiSt, Z = A.r2, P = S.C.r2;
    const you = S.rabbits.some(r => r.hold.hum >= P.onT) ? '你在抓兔' : A.pushing ? '你在推鹿' : Math.max(...Z.E) >= P.trigE ? '你往兔子走' : '你沒在推鹿';
    const plan = A.mode !== 'rab' ? '要抓鹿' : Z.why === 'late' ? '時間不夠，改抓兔' : '判斷鹿沒希望，改抓兔';
    return `AI${R2LABEL[A.mode] || A.mode}｜${you}｜AI${plan}`;
  }
  // 讀人：推鹿（同基底 1 s 寬限）；朝哪隻兔子走（方向＋距離），累積成證據 E
  function r2Perceive(S) {
    const C = S.C, P = C.r2, A = S.aiSt, Z = A.r2, bot = S.bot, hum = S.hum;
    const dh = len(sub(hum, bot));
    if (dh < C.R) A.lastIn = S.t;
    A.pushing = (S.t - A.lastIn) <= C.grace;
    if (S.botSt.pinched) Z.pinT = S.t;
    const hv = sub(hum, S.humPrev), sp = len(hv) / C.dt;
    // 靠近速度：人朝某點每秒拉近的距離
    const close = p => dot(hv, unit(sub(p, hum))) / C.dt;
    let k = -1;
    // 人在鹿 farB·R 內＝在鹿旁繞位，不讀成朝兔
    if (dh >= P.farB * C.R) {
      const cb = close(bot);
      let best = 1e9;
      S.rabbits.forEach((r, j) => {
        const dr = len(sub(r, hum));
        const head = sp > P.headV * C.vH && close(r) > Math.cos(P.headA * D2R) * sp && cb < P.apprB * C.vH;
        if ((head || dr < P.nearR * C.R) && dr < best) { best = dr; k = j; }
      });
    }
    // 人已站上兔子（計時中）＝最強的證據：直接判成朝那隻、證據拉滿
    const on = S.rabbits.findIndex(r => r.hold.hum >= P.onT);   // 路過兔子最多停約 0.28 s，不算
    if (on >= 0) k = on;
    Z.hR = k;
    for (let j = 0; j < 2; j++) Z.E[j] = k === j ? (on === j ? P.Emax : Math.min(P.Emax, Z.E[j] + C.dt)) : Math.max(0, Z.E[j] - P.Edecay * C.dt);
  }
  function r2Set(S, mode, rab, why) {
    const A = S.aiSt, Z = A.r2;
    if (mode !== A.mode) { Z.rec.sw++; Z.rec.modes.push([+S.t.toFixed(2), mode]); Z.hold = S.C.r2.swHold; }
    if (mode === 'rab') { Z.rab = rab; Z.why = why; if (Z.rec.rabT < 0) { Z.rec.rabT = S.t; Z.rec.rabWhy = why; } }
    A.mode = mode; Z.ph = mode === 'sig' ? 'start' : ''; Z.pt = 0;
  }
  // 不抓兔時的移動：朝兔子的分量改成沿兔子外緣滑，進入 rabR + avoid 就推回圈上
  function r2Avoid(S, p0, p1) {
    const C = S.C, P = C.r2, ra = P.rabR + P.avoid;
    let v = sub(p1, p0);
    for (const r of S.rabbits) {
      const n = sub(p0, r);
      if (len(n) < ra + 2 && dot(v, n) < 0) { const nn = unit(n), sp = len(v); v = sub(v, mul(nn, dot(v, nn))); v = len(v) > 1e-6 ? mul(unit(v), sp) : v; }
    }
    let p = add(p0, v);
    for (const r of S.rabbits) { const n = sub(p, r), d = len(n); if (d < ra) p = add(r, mul(d > 1e-6 ? unit(n) : [1, 0], ra)); }
    return S.inside(p, C.hunterMargin);
  }

  function aiStepR2(S) {
    const nearHum = j => j >= 0 && len(sub(S.rabbits[j], S.hum)) < S.C.r2.commitR * S.C.R;
    const C = S.C, P = C.r2, A = S.aiSt, Z = A.r2, bot = S.bot;
    r2Perceive(S);
    Z.hold -= C.dt;
    const can = Z.hold <= 0, eMax = Math.max(...Z.E), hj = Z.E[0] >= Z.E[1] ? 0 : 1;
    // 時間不夠：剩 lateT 秒而鹿 lateGrace 秒內沒被夾住 → 抓離自己近的兔子
    const late = C.T - S.t <= P.lateT && S.t - Z.pinT > P.lateGrace;
    const nearRab = () => len(sub(S.rabbits[0], S.ai)) <= len(sub(S.rabbits[1], S.ai)) ? 0 : 1;
    if (A.mode !== 'rab' && late) r2Set(S, 'rab', nearRab(), 'late');
    else if ((A.mode === 'lead' || A.mode === 'fill') && can) {
      if (eMax >= P.trigE && Z.nSig < P.sigMax) { r2Set(S, 'sig'); Z.nSig++; Z.rec.sigT = S.t; }
      else if (eMax >= P.decE && nearHum(hj) && Z.sigDone >= 1) r2Set(S, 'rab', 1 - hj, 'hum');
      else if (A.mode === 'lead' && A.pushing) r2Set(S, 'fill');   // 補位後不再切回帶路：站位幾何隨人在不在推而變（同 R3）
    } else if (A.mode === 'sig' && P.abortOn && S.rabbits.some(r => r.hold.hum > 0) && Z.ph !== 'dash') {
      // 人已站上兔子（計時中）且衝刺未開始或已結束：示意算失敗，直接搶另一隻
      const j = S.rabbits.findIndex(r => r.hold.hum > 0); r2Set(S, 'rab', 1 - j, 'hum');
    } else if (A.mode === 'sig' && can) {
      if (Z.ph === 'watch' && Z.pt >= P.watchT) {
        if (eMax >= P.decE && nearHum(hj)) r2Set(S, 'rab', 1 - hj, 'hum'); else r2Set(S, A.pushing ? 'fill' : 'lead');
      }
    } else if (A.mode === 'rab' && can) {
      // 人回頭推鹿（且時間還夠）→ 回去補位
      if (Z.why === 'hum' && A.pushing && eMax < 0.1) r2Set(S, 'fill');
    }
    // ---- 目標點 ----
    let at, direct = false;
    if (A.mode === 'sig') {
      [at, direct] = sigStep(S, P, 0, K_ => r3Engaged(S, K_));
      if (Z.ph === 'dash' && Z.rec.dashT < 0) Z.rec.dashT = S.t;
      if (Z.sigDone >= 1 && Z.rec.sigEnd < 0) Z.rec.sigEnd = S.t;
    } else if (A.mode === 'rab') { at = S.rabbits[Z.rab]; direct = true; }
    else at = r3Engaged(S, 0);
    A.target = at;
    const nx = direct ? S.inside(add(S.ai, clampLen(sub(at, S.ai), C.vH * C.dt)), C.hunterMargin) : goTo(S, S.ai, at);
    S.ai = A.mode === 'rab' ? nx : r2Avoid(S, S.ai, nx);
    if (A.mode !== 'rab') Z.rec.minRabD = Math.min(Z.rec.minRabD, ...S.rabbits.map(r => len(sub(S.ai, r))));
    if (len(sub(S.ai, bot)) >= C.R && len(sub(S.hum, bot)) >= C.R && A.mode !== 'rab') { Z.rec.idleBoth += C.dt; Z.rec.maxIdleBoth = Math.max(Z.rec.maxIdleBoth, Z.rec.idleBoth); } else Z.rec.idleBoth = 0;
  }
  // 抓兔：獵人中心在兔 rabR 內連續停 dwellT 秒（離開就歸零）；人、AI 各自計時，先滿者抓到，同一步都滿＝both。進度在 S.rabbits[j].hold
  function r2Touch(S) {
    const C = S.C, P = C.r2, full = x => x >= P.dwellT - 1e-9;
    let h = -1, a = -1;
    S.rabbits.forEach((r, j) => {
      r.hold.hum = len(sub(S.hum, r)) < P.rabR ? r.hold.hum + C.dt : 0;
      r.hold.ai = C.aiOn && len(sub(S.ai, r)) < P.rabR ? r.hold.ai + C.dt : 0;
      if (full(r.hold.hum) && h < 0) h = j;
      if (full(r.hold.ai) && a < 0) a = j;
    });
    if (h < 0 && a < 0) return false;
    const pts = Math.ceil((C.T - S.t) * P.rabMul);
    S.phase = 'end';
    S.result = { caught: true, t: S.t, by: 'rabbit', who: h >= 0 && a >= 0 ? 'both' : h >= 0 ? 'hum' : 'ai', rab: h >= 0 ? h : a, ptsHum: h >= 0 ? pts : 0, ptsAi: a >= 0 ? pts : 0, aiMode: S.aiSt.mode };
    S.result.pts = S.result.ptsHum;
    return true;
  }

  function botStep(S, hunters) {

  function buildBg() {

  // R3 兩個柵欄用不同顏色；顏色每回合隨機分配，與倍率無關

  function drawPen(c, col) {

  // 角色畫的位置夾在畫布內（獵人可走到離牆 16 px，角色半寬 32 px 會被切掉）；只影響畫面
  const onCanvas = p => [Math.min(C0.W - AS / 2, Math.max(AS / 2, p[0])), Math.min(C0.H - AS / 2, Math.max(AS / 2, p[1]))];

  }

  // 面板：米色底、3 px 深色框、直角。a＝不透明度（側欄與說明列 1；場地上的浮層 0.92）
  function panel(x, y, w, h, a = 0.92) {
    ctx.fillStyle = `rgba(255,248,232,${a})`; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = COL.ink; ctx.lineWidth = BW; ctx.strokeRect(x + BW / 2, y + BW / 2, w - BW, h - BW);
  }
  // ---- 名牌：候選位置（上、下、左、右）中挑「蓋到角色、其他名牌、倍率牌、出界」最少的；旁邊畫 6 px 小尖角指向角色 ----
  const TAG_H = LH, placed = [];
  const ov = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  function tag(s, p, color, avoid) {
    p = onCanvas(p);
    const w = Math.ceil(tw(s)) + 2 * U, h = TAG_H, g = AS / 2 + 6;
    const cands = [['up', p[0], p[1] - g - h / 2], ['down', p[0], p[1] + g + h / 2], ['right', p[0] + g + w / 2, p[1]], ['left', p[0] - g - w / 2, p[1]]];
    let best = null;
    cands.forEach(([d, cx, cy], k) => {
      const r = [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
      let cost = k * 40;                                   // 同分時照上、下、右、左的順序
      for (const a of avoid) cost += ov(r, a) * 3;
      for (const q of placed) cost += ov(r, q) * 6;
      const out = Math.max(0, TREE - r[1]) + Math.max(0, r[3] - (explain ? PEN_BOT : C0.H - TREE)) + Math.max(0, -r[0]) + Math.max(0, r[2] - C0.W);

    });

    if (d === 'right') { ctx.fillRect(cx - w / 2 - 3, cy - 6, 3, 12); ctx.fillRect(cx - w / 2 - 6, cy - 3, 3, 6); }
    if (d === 'left') { ctx.fillRect(cx + w / 2, cy - 6, 3, 12); ctx.fillRect(cx + w / 2 + 3, cy - 3, 3, 6); }

  // ---- 側欄（畫布座標）----
  // 資料卡：上方一行標籤（33），下方數值（44）
  function statCard(x, y, label, rows) {
    const w = RW - 2 * U, h = U + LH + rows.length * LH_L + U;

  }
  // 按鈕：米色面＋3 px 深框＋底部 6 px 深色陰影（跟 HTML 按鈕同一套）；選中＝深底米字、米色框

    else panel(b.x, b.y, BTN_W, BTN_H, 1);

  }
  function drawRails() {

    const left = Math.max(0, Math.ceil(S.C.T - S.t)), x = U;
    let y = statCard(x, U, '剩餘', [['', `${left} 秒`, left <= 10 ? COL.warn : COL.ink]]) + U;
    y = S.C.r2 ? statCard(x, y, '分數', [['你', `${score}`, COL.human], ['AI', `${aiScore}`, COL.ai]]) : statCard(x, y, '分數', [['', `${score}`, COL.ink]]);
    // 回合卡貼齊左欄底部（孟炫 2026-09-26：不放子規則卡）

    const z = l => l[1] === 'title' ? FS_L : FS, lh = l => l[1] === 'title' ? LH_L + U : LH;

    w = Math.max(440, Math.ceil(w) + 4 * U); const h = 4 * U + lines.reduce((a, l) => a + lh(l), 0), x = Math.round((C0.W - w) / 2), y = Math.round((C0.H - h) / 2);

  }

  }
  // 說明列：場地下緣一整條（y 602–640，在柵欄下方），只放一行；「｜」改成段落間的小方點，不像框線

  const mulRect = tr => { const s = `${tr.mul}×`, w = Math.ceil(tw(s, FS_L)) + 2 * U, h = LH_L, cy = tr.p[1] + (tr.p[1] < C0.H / 2 ? -44 : 44); return [tr.p[0] - w / 2, cy - h / 2, tr.p[0] + w / 2, cy + h / 2, s]; };

    S.C.traps.forEach((tr, i) => {
      if (!mulShown(tr, i)) return;

  function drawExplainR3() {
    const A = S.aiSt, Z = A.r3, T = S.C.traps;
    const tgt = Z.K >= 0 ? `→${where(Z.K)}` : '';
    const you = Z.hT >= 0 ? `你往${where(Z.hT)}${Z.ins > 0.2 ? ` 堅持${Z.ins.toFixed(1)}s` : ''}` : '你：看不出';
    explainBar(`AI${Z.know ? '知情' : '不知情'}｜${SIM.R3LABEL[A.mode] || A.mode}${tgt}｜${you}`);
    if (A.target) { const p = A.target; ctx.fillStyle = COL.ai; for (const [dx, dy] of [[-6, -6], [-3, -3], [0, 0], [3, 3], [6, 6], [6, -6], [3, -3], [-3, 3], [-6, 6]]) ctx.fillRect(p[0] + dx - 1.5, p[1] + dy - 1.5, 3, 3); }
  }
  function drawExplain() {
    if (S.blind && (S.C.r3 || S.C.r2)) {
      const line = S.C.r3 ? `AI${S.C.r3 && S.C.info === 'A' ? '知情' : '不知情'}，也看不到你｜趕鹿→${where(S.aiTrapI)}`
        : S.aiSt.mode === 'rab' ? 'AI也看不到你｜時間不夠，改抓兔' : 'AI也看不到你，但他還是在嘗試趕鹿（繞開兔子）';

    const line = S.blind ? `AI${name}`
      : `AI ${name}｜${A.pushing ? '你在推' : '你沒在推'}｜鹿${S.botSt.pinched ? '被夾住' : '沒被夾住'}`;
    explainBar(line);
    if (!S.blind) { const p = A.target; ctx.fillStyle = COL.ai; for (const [dx, dy] of [[-6, -6], [-3, -3], [0, 0], [3, 3], [6, 6], [6, -6], [3, -3], [-3, 3], [-6, 6]]) ctx.fillRect(p[0] + dx - 1.5, p[1] + dy - 1.5, 3, 3); }

  function drawStick() {

  // ---- 主迴圈：固定時間步，每幀最多補 5 步 ----
  let acc = 0, last = performance.now(), deerFlip = false, humFlip = false, aiFlip = false;

      }

    const actors = [{ n: 'deer', p: S.bot, f: deerFlip, m: V.len(mvB) > .05, ph: 0 }, { n: 'human', p: S.hum, f: humFlip, m: V.len(mvH) > .05, ph: 1 }];
    if (!S.blind) actors.push({ n: 'ai', p: S.ai, f: aiFlip, m: V.len(mvA) > .05, ph: 2 });

    for (const a of actors) { const q = onCanvas(a.p); tile(a.n, q[0] - AS / 2, q[1] - AS / 2 + bob(a.m && play, t, a.ph), a.f, AS); }
    if (S.botSt.threat && S.phase === 'play') {        // 鹿被威脅（有獵人在驅趕圈內）：像素驚嘆號；太靠上緣時改畫在右側
      const top = S.bot[1] < 84, x = Math.round(S.bot[0] / 3) * 3 + (top ? 39 : 15), y = Math.round(S.bot[1] / 3) * 3 + (top ? -15 : -60);
      ctx.fillStyle = COL.ink; ctx.fillRect(x - 3, y - 3, 12, 24); ctx.fillRect(x - 3, y + 24, 12, 12);
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(x, y, 6, 18); ctx.fillRect(x, y + 27, 6, 6);
    }

    if (S.rabbits) S.rabbits.forEach(r => {       // 抓兔計時圈：停在兔子上 1 秒，右上方的圈逐漸填滿
      const h = r.hold || {}, prog = Math.max(h.hum || 0, h.ai || 0) / (S.C.r2.dwellT || 1);

      const x = r[0] + 44, y = r[1] - 8, col = (h.hum || 0) >= (h.ai || 0) ? COL.human : COL.ai;
